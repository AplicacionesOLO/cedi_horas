<!DOCTYPE html>
<html lang="es-CR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00B497">
<meta name="description" content="OLO · Control de horas de personal externo para descarga de contenedores. Ciclo viernes a jueves, costos en colones.">
<title>OLO · Horas de personal externo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23fff'/%3E%3Crect x='4' y='9' width='10' height='10' rx='2' fill='none' stroke='%23251E1F' stroke-width='3'/%3E%3Crect x='18' y='9' width='10' height='10' rx='2' fill='%2300B497'/%3E%3C/svg%3E">
<style>
  html, body { margin:0; padding:0; height:100%; background:#EEF0F1; }
  #app { min-height:100%; }
  #cargando { display:flex; flex-direction:column; gap:18px; align-items:center; justify-content:center;
              height:100vh; font-family:'Poppins',ui-sans-serif,system-ui,sans-serif;
              color:#6E7479; font-size:13px; letter-spacing:.08em; text-transform:uppercase; }
  #sinjs { font-family:ui-sans-serif, system-ui, sans-serif; max-width:520px; margin:80px auto;
           padding:20px; border-left:4px solid #00B497; background:#E6F6F2; border-radius:10px; line-height:1.6; }
</style>

<!-- Librerías (React, gráficos, Babel para transpilar el JSX en el navegador) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script crossorigin src="https://unpkg.com/recharts@2/umd/Recharts.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Conexión a Supabase (ver CONECTAR_SUPABASE.md) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script src="./supabase-bridge.js"></script>
</head>
<body>
<div id="app"><div id="cargando">Cargando…</div></div>
<noscript>
  <div id="sinjs"><strong>Esta aplicación necesita JavaScript.</strong><br>
  Activalo en la configuración del navegador y recargá la página.</div>
</noscript>

<!--
  Carga el fuente cedis-horas.jsx, neutraliza sus imports (React y recharts ya
  están como globales por los <script> de arriba), lo transpila con Babel en el
  navegador y monta <App/>. Así el HTML corre exactamente el mismo código fuente,
  sin necesitar un paso de build.
-->
<script>
(function () {
  function fallo(msg) {
    document.getElementById("app").innerHTML =
      '<div id="sinjs"><strong>No se pudo cargar la aplicación.</strong><br>' + msg + '</div>';
  }

  fetch("./cedis-horas.jsx", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (fuente) {
      // 1) Quitar las líneas de import (usamos los globales React y Recharts).
      var codigo = fuente
        .replace(/^\s*import\s+React[\s\S]*?from\s+["']react["'];?/m, "")
        .replace(/^\s*import\s*\{[\s\S]*?\}\s*from\s+["']recharts["'];?/m, "");

      // 2) Preludio: desestructurar hooks y componentes de recharts desde los globales.
      var preludio =
        "const { useState, useEffect, useMemo, useRef } = React;\n" +
        "const {\n" +
        "  ResponsiveContainer, ComposedChart, Bar, Line, Area, XAxis, YAxis,\n" +
        "  CartesianGrid, Tooltip, ReferenceLine, Cell, LineChart\n" +
        "} = (window.Recharts || {});\n";

      // 3) Quitar 'export default' y exponer App en window.
      codigo = codigo.replace(/export\s+default\s+function\s+App/, "function App");
      var epilogo = "\nwindow.__OLO_APP__ = App;\n";

      // 4) Transpilar JSX → JS y ejecutar.
      var salida = Babel.transform(preludio + codigo + epilogo, { presets: ["react"] }).code;
      var run = new Function(salida);
      run();

      if (!window.__OLO_APP__) throw new Error("No se encontró el componente App.");
      var cont = document.getElementById("app");
      cont.innerHTML = "";
      ReactDOM.createRoot(cont).render(React.createElement(window.__OLO_APP__));
    })
    .catch(function (e) {
      fallo("Serví la carpeta con un servidor web (no abras el archivo con file://). Detalle: " + e.message);
    });
})();
</script>
</body>
</html>
