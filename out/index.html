<!DOCTYPE html>
<html lang="es-CR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00B497">
<meta name="description" content="OLO · Control de horas de personal externo para descarga de contenedores. Ciclo viernes a jueves, costos en colones.">
<title>OLO · Horas de personal externo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23fff'/%3E%3Crect x='4' y='9' width='10' height='10' rx='2' fill='none' stroke='%23251E1F' stroke-width='3'/%3E%3Crect x='18' y='9' width='10' height='10' rx='2' fill='%2300B497'/%3E%3C/svg%3E">
<style>
  html, body { margin:0; padding:0; height:100%; background:#EEF0F1; }
  #app { min-height:100%; }
  #cargando { display:flex; flex-direction:column; gap:18px; align-items:center; justify-content:center;
              height:100vh; font-family:'Poppins',ui-sans-serif,system-ui,sans-serif;
              color:#6E7479; font-size:13px; letter-spacing:.08em; text-transform:uppercase; }
  #sinjs { font-family:ui-sans-serif, system-ui, sans-serif; max-width:520px; margin:80px auto;
           padding:20px; border-left:4px solid #00B497; background:#E6F6F2; border-radius:10px; line-height:1.6; }
</style>

<!-- Librerías (React, gráficos, Babel para transpilar el JSX en el navegador) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/recharts@2.15.4/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Conexión a Supabase (ver CONECTAR_SUPABASE.md) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script src="./supabase-bridge.js"></script>
</head>
<body>
<div id="app"><div id="cargando">Cargando…</div></div>
<noscript>
  <div id="sinjs"><strong>Esta aplicación necesita JavaScript.</strong><br>
  Activalo en la configuración del navegador y recargá la página.</div>
</noscript>

<!--
  Carga el fuente cedis-horas.jsx, lo transpila con Babel en el navegador
  (JSX + módulos ESM → CommonJS) y monta <App/>. Los import de "react" y
  "recharts" se resuelven contra los globales UMD cargados arriba.
  Así el HTML corre exactamente el mismo código fuente, sin paso de build.
-->
<script>
(function () {
  function fallo(msg) {
    document.getElementById("app").innerHTML =
      '<div id="sinjs"><strong>No se pudo cargar la aplicación.</strong><br>' + msg + '</div>';
  }

  // Resuelve los import del fuente ("react" y "recharts") contra los globales UMD.
  function requireFalso(nombre) {
    if (nombre === "react") return window.React;
    if (nombre === "react-dom" || nombre === "react-dom/client") return window.ReactDOM;
    if (nombre === "recharts") {
      if (!window.Recharts) throw new Error("No se cargó Recharts (revisá conexión o bloqueadores de scripts).");
      return window.Recharts;
    }
    throw new Error("Módulo no disponible: " + nombre);
  }

  fetch("./cedis-horas.jsx", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (fuente) {
      // Babel convierte JSX y transforma los import/export ESM a CommonJS,
      // así no dependemos de regex para quitar los imports (más robusto).
      var salida = Babel.transform(fuente, {
        presets: [["react", { runtime: "classic" }]],
        plugins: ["transform-modules-commonjs"],
        sourceType: "module",
      }).code;

      // Ejecuta el módulo transpilado dándole un require/module/exports falsos.
      var modulo = { exports: {} };
      var fn = new Function("require", "module", "exports", "React", "ReactDOM", salida);
      fn(requireFalso, modulo, modulo.exports, window.React, window.ReactDOM);

      // El componente App se exporta como default.
      var App = modulo.exports && (modulo.exports.default || modulo.exports.App);
      if (!App) throw new Error("No se encontró el componente App exportado.");

      var cont = document.getElementById("app");
      cont.innerHTML = "";
      ReactDOM.createRoot(cont).render(React.createElement(App));
    })
    .catch(function (e) {
      fallo("Serví la carpeta con un servidor web (no abras el archivo con file://). Detalle: " + e.message);
    });
})();
</script>
</body>
</html>
